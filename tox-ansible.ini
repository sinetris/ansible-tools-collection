[ansible]
skip =
    devel
    py3.10
    2.13
    2.14
    2.15

[common]
collection_name = sinetris.tools
collection_path = sinetris/tools
collection_pkg_name = sinetris-tools

ansible_collections_path = {env_tmp_dir}/collections
collection_build_path = {env_tmp_dir}/collection_build
full_collection_path = {[common]ansible_collections_path}/ansible_collections/{[common]collection_path}

base_python = py3.13
cache_path = {env_dir}/cache

[tox]
requires =
    tox >= 4.29
    tox-ansible >= 25
    tox-extra >= 2.2
    tox-docker
    tox-uv
isolated_build = true
skip_missing_interpreters = true
skipsdist = true
work_dir = {tox_root}/.tox

[testenv]
env_dir = {work_dir}/{env_name}
deps =
  -r {toxinidir}/requirements-test.in
isolated_build = true
pass_env =
    DOCKER_HOST
    GITHUB_TOKEN
    MOLECULE_OPTS
set_env =
    ANSIBLE_COLLECTIONS_PATH={[common]ansible_collections_path}
    XDG_CACHE_HOME={[common]cache_path}
    MOLECULE_OPTS=--no-parallel --report

[testenv:galaxy]
deps =
    galaxy-importer >= 0.4.31
set_env =
    {[testenv]set_env}
    PIP_CONSTRAINT=/dev/null
    UV_CONSTRAINT=/dev/null

[testenv:clean]
description = Cleanup artifacts
base_python = {[common]base_python}
skip_install = true
commands =
    ; molecule destroy
    rm -rf "{work_dir}"/lint
    rm -rf "{work_dir}"/galaxy
    rm -rf "{work_dir}"/deps
    sh -c 'rm -rf "{tox_root}"/collections/*'
    sh -c 'rm -rf "{work_dir}"/integration-*'
    sh -c 'rm -rf "{work_dir}"/unit-*'
    sh -c 'rm -rf "{work_dir}"/sanity-*'
    sh -c 'rm -rf "{work_dir}"/changelogs-*'
    sh -c 'rm -rf "{work_dir}"/docs-*'
allowlist_externals =
    rm
    sh

[testenv:lint]
description = Enforce quality standards
base_python = {[common]base_python}
deps =
    pre-commit>=4.3
    pre-commit-uv>=4.1.5
commands_pre =
    pre-commit validate-config
commands =
    pre-commit run --show-diff-on-failure --all-files

[testenv:deps]
description = Bump all dependencies
base_python = {[common]base_python}
deps =
    {[testenv:lint]deps}
commands_pre =
    pre-commit validate-config
commands =
    pre-commit autoupdate
    pre-commit run --all-files --show-diff-on-failure --hook-stage manual deps

[testenv:docs-update]
description = Update documentation
base_python = {[common]base_python}
package = editable
deps =
    -r {toxinidir}/docs/requirements.in
commands_pre =
    ; Note: Using --force-with-deps, and --no-cache to avoid the risk of building
    ;   docs for an older version
    ansible-galaxy \
        collection install \
        --collections-path . \
        --no-cache \
        --force-with-deps \
        .
commands =
    collection_prep_add_docs -p . --link-collection
    antsibull-docs \
        --config-file docs/antsibull-docs.cfg \
        lint-collection-docs \
        --output-format simplified-rst \
        --validate-collection-refs all \
        --disallow-unknown-collection-refs \
        --check-extra-docs-refs \
        --no-skip-rstcheck \
        --plugin-docs \
        .

[testenv:docs-build]
description = Build documentation html
base_python = {[common]base_python}
package = editable
deps =
    {[testenv:docs-update]deps}
    -r {toxinidir}/docs/requirements-build.in
commands_pre =
    # Use temp-rst as a temporary directory to generate the collection documentation
    rm -rf docs/temp-rst
    mkdir -p docs/temp-rst
commands =
    antsibull-docs \
        --config-file docs/antsibull-docs.cfg \
        collection \
        --cleanup no \
        --use-current \
        --squash-hierarchy \
        --dest-dir docs/temp-rst \
        sinetris.tools
    sphinx-build \
        --builder html \
        --conf-dir docs/preview \
        --jobs 1 \
        --show-traceback \
        --color \
        docs/temp-rst \
        docs/preview/build
allowlist_externals =
    rm
    mkdir

[testenv:changelogs-lint]
description = Lint changelogs
deps =
    {[testenv:docs-update]deps}
commands =
    antsibull-changelog lint {posargs}

[testenv:changelogs-release]
description = Build changelogs release
deps =
    {[testenv:docs-update]deps}
depends =
    changelogs-lint
commands =
    antsibull-changelog release {posargs:-v}
