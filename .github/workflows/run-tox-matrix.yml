---
name: Run matrix scope

"on":
  workflow_call:
    inputs:
      matrix_scope:
        required: true
        type: string

jobs:
  tox-matrix:
    name: Matrix ${{ inputs.matrix_scope }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: "${{github.event.pull_request.head.ref}}"
          repository: "${{ github.event.pull_request.head.repo.full_name }}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version-default"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install ansible-dev-environment
        run: uv tool install ansible-dev-environment

      - name: Install tox and required dependencies
        run: uv tool install tox --with tox-ansible,tox-docker,tox-extra,tox-uv

      - name: Generate matrix
        id: generated-matrix
        run: >
          uvx tox --ansible --gh-matrix --matrix-scope ${{ inputs.matrix_scope }}

    outputs:
      envlist: "${{ steps.generated-matrix.outputs.envlist }}"

  test:
    needs: tox-matrix
    strategy:
      fail-fast: false
      matrix:
        entry: "${{ fromJson(needs.tox-matrix.outputs.envlist) }}"
    name: "${{ matrix.entry.name }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.entry.python }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install ansible-dev-environment
        run: uv tool install ansible-dev-environment

      - name: Install tox and required dependencies
        run: uv tool install tox --with tox-ansible,tox-docker,tox-extra,tox-uv

      - name: Run tox sanity tests
        run: >-
          uvx tox --ansible -e ${{ matrix.entry.name }}
