---
# yamllint disable rule:line-length
name: "CI"
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-collection-version:
    uses: ./.github/workflows/validate_collection_version.yml
  changelog:
    uses: ansible/ansible-content-actions/.github/workflows/changelog.yaml@main
    if: github.event_name == 'pull_request'
  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@main
  ansible-lint:
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@main
  sanity-tests:
    uses: ansible/ansible-content-actions/.github/workflows/sanity.yaml@main
  unit-tests:
    uses: ansible/ansible-content-actions/.github/workflows/unit.yaml@main
  integration-tests:
    uses: ./.github/workflows/run-tox-matrix.yml
    with:
      matrix_scope: molecule
  all_green:
    if: ${{ always() }}
    needs:
      - validate-collection-version
      - changelog
      - build-import
      - ansible-lint
      - sanity-tests
      - unit-tests
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - run: >-
          python -c "assert 'failure' not in set([
            '${{ needs.validate-collection-version.result }}',
            '${{ needs.changelog.result }}',
            '${{ needs.build-import.result }}',
            '${{ needs.sanity.result }}',
            '${{ needs.unit-galaxy.result }}',
            '${{ needs.integration.result }}',
            '${{ needs.ansible-lint.result }}',
          ])"
