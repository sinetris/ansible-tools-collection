---

- name: Create resources
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create containers from inventory
      community.docker.docker_container:
        name: "{{ instance }}"
        hostname: "{{ hostvars[instance]['container_hostname'] | default(instance) }}"
        image: "{{ hostvars[instance]['container_image'] | default('python:slim-bookworm') }}"
        command: "{{ hostvars[instance]['container_command'] | default('sleep infinity') }}"
        privileged: "{{ hostvars[instance]['container_privileged'] | default(false) }}"
        volumes: "{{ hostvars[instance]['container_volumes'] | default(omit) }}"
        capabilities: "{{ hostvars[instance]['container_capabilities'] | default(omit) }}"
        log_driver: "{{ hostvars[instance]['container_log_driver'] | default('json-file') }}"
        user: "{{ hostvars[instance]['container_user'] | default(omit) }}"
        state: "{{ hostvars[instance]['container_state'] | default('present') }}"
        recreate: "{{ hostvars[instance]['container_recreate'] | default(false) }}"
        healthy_wait_timeout: "{{ hostvars[instance]['container_healthy_wait_timeout'] | default(120) }}"
        healthcheck: "{{ hostvars[instance]['container_healthcheck'] | default(omit) }}"
      register: containers_result
      loop: "{{ groups['containers'] }}"
      loop_control:
        loop_var: instance
        label: "{{ instance }}"
- name: Testing containers
  hosts: containers
  gather_facts: true
  tasks:
    - name: Assert that is working
      ansible.builtin.assert:
        that:
          - nope == {{ inventory_hostname }}
