[project]
name = "sinetris.tools"
version = "0.1.4"
requires-python = ">=3.11"
dependencies = []

[tool.black]
line-length = 100

[tool.pytest.ini_options]
addopts = ["-vvv", "-n", "2", "--log-level", "WARNING", "--color", "yes"]
filterwarnings = ['ignore:AnsibleCollectionFinder has already been configured']
testpaths = ["tests"]

[tool.tox-ansible]
# Skipping:
#   'integration-*' -> Using molecule for integration tests
#   py3.11, py3.12, devel, milestone -> Testing only latest 3 stable releases
#   py3.15 -> Still smaller compatibility problems with some dependencies (will be added later)
skip = [
    "integration-",
    "py3.11",
    "py3.12",
    "py3.15",
    "devel",
    "milestone",
]
