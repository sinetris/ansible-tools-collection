[common]
collection_name = sinetris.tools
collection_path = sinetris/tools
collection_pkg_name = sinetris-tools
base_python = py3.14

[tox]
requires =
    tox >= 4.67
    tox-ansible >= 26
    tox-docker
    tox-uv
no_package = true

[testenv]
env_dir = {work_dir}/{env_name}
deps =
  -r "{tox_root}"/requirements-test.in
pass_env =
    DOCKER_HOST
    GITHUB_TOKEN
    MOLECULE_OPTS
setenv =
    TOX_ENVNAME={envname}
    MOLECULE_EPHEMERAL_DIRECTORY=/tmp/{envname}

[testenv:galaxy]
deps =
    {[testenv]deps}
    galaxy-importer >= 0.4.31

[testenv:clean]
description = Cleanup artifacts
base_python = {[common]base_python}
commands =
    ; tox_root is the project root
    ; work_dir default is {tox_root}/.tox
    ; Delete generated ansible artifacts
    sh -c 'rm -rf "{tox_root}"/.ansible/*'
    ; Delete installed ansible collections
    sh -c 'rm -rf "{tox_root}"/ansible_collections/*'
    ; Delete generated docs artifacts
    sh -c 'rm -rf "{tox_root}"/docs/preview/build/*'
    sh -c 'rm -rf "{tox_root}"/docs/temp-rst/*'
    ; Cleanup generated tox environments (excluding 'clean')
    rm -rf "{work_dir}"/lint
    rm -rf "{work_dir}"/galaxy
    rm -rf "{work_dir}"/deps
    rm -rf "{work_dir}"/docs-update
    rm -rf "{work_dir}"/docs-build
    rm -rf "{work_dir}"/changelogs-lint
    rm -rf "{work_dir}"/changelogs-release
    sh -c 'rm -rf "{work_dir}"/integration-*'
    sh -c 'rm -rf "{work_dir}"/unit-*'
    sh -c 'rm -rf "{work_dir}"/sanity-*'
    sh -c 'rm -rf "{work_dir}"/molecule-*'
allowlist_externals =
    rm
    sh

[testenv:lint]
description = Enforce quality standards
base_python = {[common]base_python}
deps =
    pre-commit>=4.3
    pre-commit-uv>=4.1.5
commands_pre =
    pre-commit validate-config
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:deps]
description = Bump all dependencies
base_python = {[common]base_python}
deps =
    {[testenv:lint]deps}
commands_pre =
    pre-commit validate-config
recreate_commands =
    {env_python} -Im pre_commit clean
commands =
    pre-commit autoupdate
    pre-commit run --all-files --show-diff-on-failure pip-compile

[testenv:docs-update]
description = Update documentation
base_python = {[common]base_python}
package = editable
deps =
    -r "{tox_root}"/docs/requirements.in
commands_pre =
    ; Note: Using --force-with-deps, and --no-cache to avoid the risk of building
    ;   docs for an older version
    ansible-galaxy \
        collection install \
        --collections-path . \
        --no-cache \
        --force-with-deps \
        .
commands =
    collection_prep_add_docs -p . --link-collection
    antsibull-docs \
        --config-file docs/antsibull-docs.cfg \
        lint-collection-docs \
        --output-format simplified-rst \
        --validate-collection-refs all \
        --disallow-unknown-collection-refs \
        --check-extra-docs-refs \
        --no-skip-rstcheck \
        --plugin-docs \
        .

[testenv:docs-build]
description = Build documentation html
base_python = {[common]base_python}
package = editable
deps =
    {[testenv:docs-update]deps}
    -r "{tox_root}"/docs/requirements-build.in
commands_pre =
    ; Note: Using --force-with-deps, and --no-cache to avoid the risk of building
    ;   docs for an older version
    ansible-galaxy \
        collection install \
        --collections-path . \
        --no-cache \
        --force-with-deps \
        .
    # Use temp-rst as a temporary directory to generate the collection documentation
    rm -rf docs/temp-rst
    mkdir -p docs/temp-rst
commands =
    antsibull-docs \
        --config-file docs/antsibull-docs.cfg \
        collection \
        --cleanup no \
        --use-current \
        --squash-hierarchy \
        --dest-dir docs/temp-rst \
        {[common]collection_name}
    sphinx-build \
        --builder html \
        --conf-dir docs/preview \
        --jobs 1 \
        --show-traceback \
        --color \
        docs/temp-rst \
        docs/preview/build
allowlist_externals =
    rm
    mkdir

[testenv:changelogs-lint]
description = Lint changelogs
deps =
    {[testenv:docs-update]deps}
commands =
    antsibull-changelog lint {posargs}

[testenv:changelogs-release]
description = Build changelogs release
deps =
    {[testenv:docs-update]deps}
depends =
    changelogs-lint
commands =
    antsibull-changelog release {posargs:-v}
